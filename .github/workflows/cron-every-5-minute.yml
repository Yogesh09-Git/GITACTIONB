name: Daily Cron job

on:
  schedule:
    - cron: '5 * * * *'
jobs:
  run-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: print message
        run: echo Job Start!

      # Runs a set of commands using the runners shell
      - name: display date and time
        run: date

      - name: print complete message
        run: echo complete
