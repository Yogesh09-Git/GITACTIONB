name:  CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
 
  build:
    
    runs-on: ubuntu-latest

   
    steps:
    
      - uses: actions/checkout@v4

      - name: print a message
        run: echo Success

      - name: Display the current date and time
        run: date

      - name: display the current working directory
        run: pwd
